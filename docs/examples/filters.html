<link rel="stylesheet" href="../assets/site.css" />
<link rel="stylesheet" href="../dist/kiri.min.css" />
</head>
<body>

<main>
  <h1>Filters</h1>
  <p class="lead">Brightness, contrast, saturation, sharpness, grayscale, sepia — live.</p>

  <div id="cropper"></div>

  <div class="controls">
    <label>Brightness <input id="brightness" type="range" min="0" max="2" step="0.05" value="1" /></label>
    <label>Contrast <input id="contrast" type="range" min="0" max="2" step="0.05" value="1" /></label>
    <label>Saturation <input id="saturation" type="range" min="0" max="2" step="0.05" value="1" /></label>
    <label>Sharpness <input id="sharpness" type="range" min="1" max="4" step="0.1" value="1" /></label>
  </div>
  <div class="controls">
    <label><input id="grayscale" type="checkbox" /> Grayscale</label>
    <label><input id="sepia" type="checkbox" /> Sepia</label>
  </div>
</main>

<script src="../dist/kiri.min.js"></script>
<script>
  const cropper = new Kiri(document.getElementById("cropper"), {
    frame: { shape: "rectangle", width: 240, height: 240 },
  });
  cropper.load("../assets/cat.jpg");

  function applyFilters() {
    cropper.setFilters({
      brightness: Number(brightness.value),
      contrast: Number(contrast.value),
      saturation: Number(saturation.value),
      sharpness: Number(sharpness.value),
      grayscale: grayscale.checked,
      sepia: sepia.checked,
    });
  }

  const brightness = document.getElementById("brightness");
  const contrast = document.getElementById("contrast");
  const saturation = document.getElementById("saturation");
  const sharpness = document.getElementById("sharpness");
  const grayscale = document.getElementById("grayscale");
  const sepia = document.getElementById("sepia");

  for (const el of [brightness, contrast, saturation, sharpness]) el.addEventListener("input", applyFilters);
  for (const el of [grayscale, sepia]) el.addEventListener("change", applyFilters);
</script>
</body>
</html>
