<main>
  <h1>Built-in zoom slider</h1>
  <p class="lead">All four <code>zoomerPosition</code> values, side by side. Identical behavior — only the placement differs.</p>

  <div class="grid">
    <div class="cell"><h3>bottom (default)</h3><div id="c-bottom"></div></div>
    <div class="cell"><h3>top</h3><div id="c-top"></div></div>
    <div class="cell"><h3>left</h3><div id="c-left"></div></div>
    <div class="cell"><h3>right</h3><div id="c-right"></div></div>
  </div>
</main>

<script src="../dist/kiri.min.js"></script>
<script>
  for (const position of ["bottom", "top", "left", "right"]) {
    const cropper = new Kiri(document.getElementById("c-" + position), {
      frame: { shape: "circle", width: 150, height: 150 },
      showZoomer: true,
      zoomerPosition: position,
    });
    cropper.load("../assets/cat.jpg");
  }
</script>
</body>
