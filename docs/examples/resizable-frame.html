<main>
  <h1>Resizable frame</h1>
  <p class="lead">Drag the small handle at the frame's bottom-right corner to resize it live.</p>

  <div id="cropper"></div>

  <div class="controls">
    <span id="size"></span>
  </div>
</main>

<script src="../dist/kiri.min.js"></script>
<script>
  const cropper = new Kiri(document.getElementById("cropper"), {
    frame: { shape: "rectangle", width: 200, height: 200 },
    resizableFrame: true,
  });
  cropper.load("../assets/cat.jpg");

  const sizeEl = document.getElementById("size");
  function updateSize() {
    const frame = document.querySelector("#cropper .kiri-frame");
    sizeEl.textContent = `Frame: ${frame.offsetWidth} x ${frame.offsetHeight}`;
  }
  cropper.on("change", updateSize);
  updateSize();
</script>
</body>
</html>
