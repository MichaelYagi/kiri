<main>
  <h1>Basic crop</h1>
  <p class="lead">The minimal setup — load, drag/zoom/rotate/flip, export.</p>

  <input id="file-input" type="file" accept="image/*" />
  <div id="cropper"></div>

  <div class="controls">
    <button id="rotate">Rotate 90°</button>
    <button id="flip-h">Flip horizontal</button>
    <button id="flip-v">Flip vertical</button>
    <button id="export">Export crop</button>
  </div>

  <div id="output"></div>
</main>

<script src="../dist/kiri.min.js"></script>
<script>
  const cropper = new Kiri(document.getElementById("cropper"), {
    frame: { shape: "rectangle", width: 240, height: 180 },
  });
  cropper.load("../assets/cat.jpg");

  document.getElementById("file-input").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (file) cropper.load(file);
  });

  document.getElementById("rotate").addEventListener("click", () => cropper.rotate(90));
  document.getElementById("flip-h").addEventListener("click", () => cropper.flipHorizontal());
  document.getElementById("flip-v").addEventListener("click", () => cropper.flipVertical());

  document.getElementById("export").addEventListener("click", async () => {
    const dataUrl = await cropper.export({ type: "base64", format: "image/png" });
    const output = document.getElementById("output");
    output.innerHTML = "";
    const img = document.createElement("img");
    img.src = dataUrl;
    output.appendChild(img);
  });
</script>
</body>
</html>
